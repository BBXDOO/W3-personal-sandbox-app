name: Validate W3 v57 mobile board APK
on:
  pull_request:
    branches: [refactor/v0.2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v57-debug:
    if: github.head_ref == 'fix/v057-mobile-board-overflow' || github.ref_name == 'fix/v057-mobile-board-overflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v057-mobile-board-overflow
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: BBXDOO/W3_HB_team_BXCGICOG
          ref: refactor/v0.2
          path: web-source-repo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-source-repo/w3_tool_store/personal_sandbox_template/source/package-lock.json
      - name: Install and validate source
        working-directory: web-source-repo/w3_tool_store/personal_sandbox_template/source
        run: |
          npm ci
          npm run lint
          npm run check:manual
      - name: Synchronize exact source bundle into Android package
        run: sh ./sync-web-assets.sh web-source-repo/w3_tool_store/personal_sandbox_template/source
      - name: Commit generated v57 web assets on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/www USER_GUIDE_TH.md
          if ! git diff --cached --quiet; then
            git commit -m "Bundle validated v57 mobile board web assets"
            git push origin HEAD:fix/v057-mobile-board-overflow
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and verify Android test APK
        run: |
          gradle --no-daemon :app:assembleDebug
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: W3-v57-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
