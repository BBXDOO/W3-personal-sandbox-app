name: Build W3 Sandbox APK

on:
  push:
    branches:
      - refactor/v0.2
  pull_request:
    branches: [refactor/v0.2]
  workflow_dispatch:
    inputs:
      package_type:
        description: 'APK type (release needs four W3_RELEASE_* secrets)'
        type: choice
        options:
          - debug
          - release
        default: debug
      publish_release:
        description: 'Publish signed APK as latest GitHub Release for in-app updates'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate and build local web source
        run: |
          python3 -m unittest discover -s tools/terminal -p 'test_*.py' -v
          npm ci --prefix web
          npm run lint
          npm run test:terminal
          npm run check:manual
          npm run build
          npm run verify:release
          git diff --exit-code -- app/src/main/assets USER_GUIDE_TH.md
      - name: Verify bundled manual matches APK
        run: python3 check-release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test local Qwen chat transport
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build test APK
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'debug') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Publish owner-signed v'))
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK archive
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'debug') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Publish owner-signed v'))
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'debug') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Publish owner-signed v'))
        with:
          name: W3-Sandbox-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build owner-signed release APK
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'release') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish owner-signed v'))
        env:
          W3_KEYSTORE_BASE64: ${{ secrets.W3_RELEASE_KEYSTORE_BASE64 }}
          W3_RELEASE_STORE_PASSWORD: ${{ secrets.W3_RELEASE_STORE_PASSWORD }}
          W3_RELEASE_KEY_ALIAS: ${{ secrets.W3_RELEASE_KEY_ALIAS }}
          W3_RELEASE_KEY_PASSWORD: ${{ secrets.W3_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$W3_KEYSTORE_BASE64" || -z "$W3_RELEASE_STORE_PASSWORD" || -z "$W3_RELEASE_KEY_ALIAS" || -z "$W3_RELEASE_KEY_PASSWORD" ]]; then
            echo 'Release signing secrets are missing.' >&2
            exit 1
          fi
          W3_RELEASE_KEYSTORE_FILE="$(mktemp)"
          trap 'rm -f "$W3_RELEASE_KEYSTORE_FILE"' EXIT
          printf '%s' "$W3_KEYSTORE_BASE64" | base64 --decode > "$W3_RELEASE_KEYSTORE_FILE"
          export W3_RELEASE_KEYSTORE_FILE
          gradle --no-daemon :app:assembleRelease
          unzip -t app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'release') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish owner-signed v'))
        with:
          name: W3-Sandbox-owner-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK for in-app updates
        if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish owner-signed v')) || (github.event_name == 'workflow_dispatch' && inputs.package_type == 'release' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(awk '$1 == "versionCode" {print $2; exit}' app/build.gradle)"
          test -n "$VERSION_CODE"
          TAG="v$VERSION_CODE"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          PREVIOUS_DIR="$(mktemp -d)"
          trap 'rm -rf "$PREVIOUS_DIR"' EXIT
          if PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null)" && [[ "$PREVIOUS_TAG" != "$TAG" ]]; then
            gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$PREVIOUS_DIR"
            shopt -s nullglob
            PREVIOUS_APKS=("$PREVIOUS_DIR"/*.apk)
            test "${#PREVIOUS_APKS[@]}" -eq 1
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            PREVIOUS_CERT="$("$APKSIGNER" verify --print-certs "${PREVIOUS_APKS[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            CURRENT_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test -n "$CURRENT_CERT"
            test "$PREVIOUS_CERT" = "$CURRENT_CERT"
            echo "Update signing certificate matches $PREVIOUS_TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#W3-Personal-Sandbox-$TAG.apk" --clobber
          else
            gh release create "$TAG" "$APK#W3-Personal-Sandbox-$TAG.apk" --target "$GITHUB_SHA" --title "W3 Personal Sandbox $TAG" --notes "อัปเดต APK ส่วนตัว: ตรวจรุ่น ดาวน์โหลด และให้ Android ยืนยันติดตั้ง"
          fi
