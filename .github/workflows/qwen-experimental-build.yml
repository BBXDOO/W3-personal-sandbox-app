name: Qwen Workspace experimental APK verification
on:
  push:
    branches:
      - feature/ai-workspace-tool-bridge
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled manual
        run: python3 check-release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: W3-Qwen-Workspace-experimental-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
